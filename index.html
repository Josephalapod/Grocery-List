<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#2D6A2E">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Grocery List</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,500;0,9..40,700;1,9..40,300&family=Instrument+Serif&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="header">
  <h1>🛒 Grocery List</h1>
  <div class="header-actions">
    <button class="header-btn" onclick="toggleCollapseAll()" title="Collapse/expand all">▤</button>
    <button class="header-btn" onclick="uncheckAll()" title="Uncheck all">↩</button>
    <button class="header-btn" onclick="showClearModal()" title="Clear all">🗑</button>
    <button class="header-btn" onclick="toggleSettings()" title="Settings">⚙</button>
  </div>
</div>

<div class="settings-overlay" id="settingsOverlay" onclick="toggleSettings()"></div>
<div class="settings-menu" id="settingsMenu">
  <div class="settings-item" onclick="toggleSinkChecked()">
    <span>Move checked to "In Cart"</span>
    <span class="toggle" id="sinkCheckedToggle"></span>
  </div>
  <div class="settings-item" onclick="toggleDarkMode()">
    <span>Dark mode</span>
    <span class="toggle" id="darkModeToggle"></span>
  </div>
  <div class="settings-item" onclick="shareList()">
    <span>Share / copy list</span>
    <span style="font-size:16px;">↗</span>
  </div>
  <div class="settings-item" onclick="checkForUpdates()">
    <span>Check for updates</span>
    <span id="updateCheckStatus" style="font-size:11px;color:var(--text-muted);"></span>
  </div>
</div>

<div class="progress-wrap">
  <div class="progress-bar-track">
    <div class="progress-bar-fill" id="progressFill"></div>
  </div>
  <div class="progress-text"><span id="progressText">0 of 0 items</span><span id="appVersion" style="float: right; opacity: 0.5; font-size: 10px;"></span></div>
</div>

<div id="recipesSection"></div>

<div id="app"></div>

<!-- Item editor sheet (rename / move / staple) -->
<div class="sheet-overlay" id="itemSheetOverlay" onclick="closeItemSheet()"></div>
<div class="sheet" id="itemSheet">
  <div class="sheet-handle"></div>
  <label class="sheet-label" for="sheetName">Name</label>
  <input class="sheet-input" id="sheetName" type="text" autocomplete="off">
  <div class="sheet-label">Category</div>
  <div class="sheet-cats" id="sheetCats"></div>
  <div class="sheet-row" id="sheetStapleRow" onclick="toggleSheetStaple()">
    <div>
      <div class="sheet-row-title">Pantry staple</div>
      <div class="sheet-row-sub">Something you always have. Recipes add it already checked.</div>
    </div>
    <span class="toggle" id="sheetStapleToggle"></span>
  </div>
  <div class="sheet-btns">
    <button class="btn-cancel" onclick="closeItemSheet()">Cancel</button>
    <button class="btn-confirm sheet-save" onclick="saveItemSheet()">Save</button>
  </div>
</div>

<!-- Clear modal -->
<div class="modal-overlay" id="clearModal">
  <div class="modal">
    <h3>Start Fresh?</h3>
    <p>This will remove all grocery items and uncheck all recipes. Your saved recipes will stay.</p>
    <div class="modal-btns">
      <button class="btn-cancel" onclick="hideClearModal()">Cancel</button>
      <button class="btn-danger" onclick="clearAll()">Clear Everything</button>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
